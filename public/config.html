<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konfiguration – Hallenmasters</title>
  <link rel="icon" type="image/png" href="/assets/Fussballwappen_logo.png">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/Fussballwappen_logo.png">

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .titleBlock h1 {
      margin: 0;
      font-size: 2rem;
      color: #e5e7eb;
    }

    .titleBlock span {
      color: #9ca3af;
      font-size: .9rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 400px;
    }

    .colTitle {
      text-align: center;
      margin-bottom: 1rem;
      color: #e5e7eb;
      font-size: 1.4rem;
      letter-spacing: .5px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: transform .15s ease, border-color .15s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .reset3v3 {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.15);
    }

    .reset5v5 {
      border-color: #16a34a;
      background: rgba(22, 163, 74, 0.15);
    }

    .resetAll {
      border-color: #dc2626;
      background: rgba(220, 38, 38, 0.15);
    }

    .card h3 {
      margin: 0 0 .5rem;
      font-size: 1.4rem;
      color: #e5e7eb;
    }

    .card p {
      margin: 0;
      color: #9ca3af;
      font-size: .95rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: #6b7280;
      font-size: .85rem;
    }
  </style>
</head>

<body>

  <header>
    <img src="/assets/Fussballwappen_logo.png" class="logo" alt="Vereinslogo" />
    <div class="titleBlock">
      <h1>Konfiguration</h1>
      <span>Systemverwaltung</span>
    </div>
  </header>

  <main>
    <div class="col">
      <h2 class="colTitle">Datenbank‑Reset</h2>

      <div class="card reset3v3" onclick="resetModule('3v3')">
        <h3>Modul Reset 3v3</h3>
        <p>Löscht alle Daten des 3vs3‑Moduls</p>
      </div>

      <div class="card reset5v5" onclick="resetModule('5v5')">
        <h3>Modul Reset 5v5</h3>
        <p>Löscht alle Daten des 5vs5‑Moduls</p>
      </div>

      <div class="card resetAll" onclick="resetModule('all')">
        <h3>Komplett‑Reset</h3>
        <p>Setzt das gesamte System zurück</p>
      </div>
    </div>
  </main>

  <footer>
    © Markus Finke - TSV Königsbrunn
  </footer>

  <script>
    async function resetModule(type) {
      const confirmText = prompt("Zum Bestätigen 'RESET' eingeben:");

      if (confirmText !== "RESET") {
        alert("Abgebrochen");
        return;
      }

      const res = await fetch(`/admin/reset-${type}`, {
        method: "POST"
      });

      const data = await res.json();
      alert(data.message || "Reset ausgeführt");
    }
  </script>

</body>
</html>
